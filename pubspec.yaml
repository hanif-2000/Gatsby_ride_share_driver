name: appkey_taxiapp_driver
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.16.2 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  intl: ^0.17.0
  shared_preferences: ^2.0.13
  page_transition: ^2.0.9
  get_it: ^7.2.0
  dio: ^4.0.4
  connectivity_plus: ^2.2.1
  dio_logger: ^4.0.8+8
  equatable: ^2.0.3
  dartz: ^0.10.1
  auto_size_text: ^3.0.0
  google_maps_flutter: ^2.2.1
  location: ^4.4.0
  geocoding: ^2.0.5
  firebase_messaging: ^11.4.2
  flutter_local_notifications: ^9.5.3+1
  geolocator: ^9.0.2
  flutter_smart_dialog: ^4.2.0
  image_picker: ^0.8.4+4
  fluttertoast: ^8.0.9
  # flutter_html: ^2.2.1
  cached_network_image: ^3.2.0
  url_launcher: ^6.1.5
  flutter_switch: ^0.3.2
  animated_toggle_switch: ^0.5.2
  package_info_plus: ^1.0.1
  flutter_svg: ^2.0.5
  dotted_line: ^3.1.0
  pinput: ^2.2.31
  flutter_rating_bar: ^4.0.1
  web_socket_client: ^0.1.0-dev.3
  timeago: ^3.3.0

dependency_overrides:
  provider: ^6.0.3
  firebase_core_platform_interface: 4.5.1

dev_dependencies:
  flutter_launcher_icons: ^0.11.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0
  google_fonts: ^2.2.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/appDriverLogo.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/auth/
    - assets/icons/profile/
    - assets/icons/home/
    - assets/icons/order/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins_regular.ttf
          weight: 400
        - asset: assets/fonts/poppins_medium.ttf
          weight: 500
        - asset: assets/fonts/poppins_semiBold.ttf
          weight: 600


