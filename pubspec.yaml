name: appkey_taxiapp_driver
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+3

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  page_transition: ^2.1.0
  get_it: ^7.7.0
  dio: ^5.7.0
  connectivity_plus: ^6.0.5
  equatable: ^2.0.5
  dartz: ^0.10.1
  auto_size_text: ^3.0.0
  google_maps_flutter: ^2.9.0
  location: ^7.0.0
  geocoding: ^3.0.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  geolocator: ^12.0.0
  flutter_smart_dialog: ^4.9.8+1
  image_picker: ^1.1.2
  fluttertoast: ^8.2.8
  lottie: ^3.1.2
  cached_network_image: ^3.4.0
  url_launcher: ^6.3.0
  flutter_switch: ^0.3.2
  animated_toggle_switch: ^0.8.3
  package_info_plus: ^8.0.2
  flutter_svg: ^2.0.10+1
  dotted_line: ^3.2.2
  pinput: ^5.0.0
  flutter_rating_bar: ^4.0.1
  web_socket_client: ^0.1.4
  timeago: ^3.7.0
  permission_handler: ^11.3.1
  app_settings: ^5.1.1
  webview_flutter: ^4.9.0
  percent_indicator: ^4.2.3
  flutter_spinkit: ^5.2.1
  firebase_core: ^3.4.0
  provider: ^6.1.2
  flutter_polyline_points: ^2.1.0
  flutter_image_compress: ^2.3.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0



# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/auth/
    - assets/icons/profile/
    - assets/icons/home/
    - assets/icons/order/
    - assets/lottie_animation/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins_regular.ttf
          weight: 400
        - asset: assets/fonts/poppins_medium.ttf
          weight: 500
        - asset: assets/fonts/poppins_semiBold.ttf
          weight: 600


