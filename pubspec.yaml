name: appkey_taxiapp_driver
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.16.2 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  intl: ^0.18.0
  shared_preferences: ^2.2.2
  page_transition: ^2.1.0
  get_it: ^7.6.6
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  auto_size_text: ^3.0.0
  google_maps_flutter: ^2.5.2
  location: ^5.0.3
  geocoding: ^2.1.1
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.0
  geolocator: ^11.0.0
  flutter_smart_dialog: ^4.9.6
  image_picker: ^1.0.7
  fluttertoast: ^8.2.4
  lottie: 3.0.0
  # flutter_html: ^2.2.1
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.3
  flutter_switch: ^0.3.2
  animated_toggle_switch: ^0.8.0
  package_info_plus: ^5.0.1
  flutter_svg: ^2.0.9
  dotted_line: ^3.2.2
  pinput: ^3.0.1
  flutter_rating_bar: ^4.0.1
  web_socket_client: ^0.1.0
  timeago: ^3.6.0
  permission_handler: ^11.1.0
  app_settings: ^5.1.1
  webview_flutter: ^4.4.4
  percent_indicator: ^4.2.3
  # web_socket_channel: ^2.4.0
  flutter_spinkit: ^5.2.0
  firebase_core: ^2.24.2
  provider: ^6.1.1
  # permission_handler: ^11.0.1
  # app_settings: ^5.1.1
  # app_settings: ^5.1.1



dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  google_fonts: ^6.1.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/appDriverLogo.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/auth/
    - assets/icons/profile/
    - assets/icons/home/
    - assets/icons/order/
    - assets/lottie_animation/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins_regular.ttf
          weight: 400
        - asset: assets/fonts/poppins_medium.ttf
          weight: 500
        - asset: assets/fonts/poppins_semiBold.ttf
          weight: 600


